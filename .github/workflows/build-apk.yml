
name: Build Touchline APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract starter project
        run: |
          unzip -o Touchline_World_Sim_Starter.zip
          cp -r Touchline_World_Sim_Starter/. .

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: touchline-world-sim-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
